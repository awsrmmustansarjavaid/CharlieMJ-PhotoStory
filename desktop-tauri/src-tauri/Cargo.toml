[package]
name = "charliemj-photostory"
version = "2.0.0"
description = "Charlie MJ PhotoStory - offline photo grid & story editor"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
base64 = "0.22"

[[bin]]
name = "charliemj-photostory"
path = "src/main.rs"
