<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CharlieMJ PhotoStory v2.0</title>
<style>
/* Dark Creative Studio — violet accent. Colours are variables so the light theme is just a swap. */
:root{--bg:#20212a;--side:#2a2c38;--canvas:#15161d;--accent:#8b5cf6;--accent2:#a78bfa;--text:#f3f4f6;--text2:#a1a1b5;--line:#3a3c4d;--field:#1c1d26;--danger:#ef4444;--ui:1}
/* 2 · Clean Minimal Studio — white / soft grey, lavender accent */
[data-theme=minimal],[data-theme=light]{--bg:#f3f4f8;--side:#ffffff;--canvas:#e6e8f0;--accent:#8b5cf6;--accent2:#7c3aed;--text:#1f2030;--text2:#62647a;--line:#dcdfea;--field:#f6f7fb}
[data-theme=minimal] .b.primary,[data-theme=light] .b.primary{box-shadow:none}
/* 3 · Premium Gradient Studio — deep navy, blue→purple gradients, translucent elevated panels */
[data-theme=premium]{--bg:#0b1030;--side:#141a44;--canvas:#080c24;--accent:#7c6cf6;--accent2:#9aa8ff;--text:#eef0ff;--text2:#9ea6d6;--line:#2a3270;--field:#0f1538}
[data-theme=premium] body{background:radial-gradient(1200px 700px at 20% -10%,#2a1b6e 0,transparent 60%),radial-gradient(900px 600px at 100% 110%,#0b4a8f 0,transparent 55%),#0b1030}
[data-theme=premium] .side,[data-theme=premium] .topbar,[data-theme=premium] .statusbar,[data-theme=premium] .viewbar{background:color-mix(in srgb,#141a44 78%,transparent);backdrop-filter:blur(12px)}
[data-theme=premium] .b.primary{background:linear-gradient(90deg,#6d5df6,#2f8cff)}
[data-theme=premium] .main{background:transparent}
[data-theme=premium] .b,[data-theme=premium] .lcard,[data-theme=premium] .layer{transition:.18s;box-shadow:0 2px 10px #0004}
[data-theme=premium] .b:hover:not(:disabled){transform:translateY(-1px)}
/* 4 · Compact Portable Workspace — dark, tight toolbars, max canvas (also toggle in Settings) */
[data-theme=compact]{--bg:#20212a;--side:#2a2c38;--canvas:#15161d}
body.compact{font-size:.93em}body.compact .b{padding:.22rem .45rem}body.compact .body{padding:.45rem}body.compact section{margin-bottom:.6rem}body.compact .brand small,body.compact .tab small{display:none}
body.compact .grp{padding-left:.4rem}body.compact .ctl{margin:.2rem 0}
[data-theme=premium]{--bg:#0b1030;--side:#141a45cc;--canvas:#070a22;--accent:#6366f1;--accent2:#a78bfa;--line:#2c3578;--field:#0f1538}
[data-theme=premium] body{background:radial-gradient(1200px 700px at 10% 0%,#1e2a78 0,transparent 60%),radial-gradient(900px 600px at 100% 100%,#4c1d95 0,transparent 55%),#0b1030}
[data-theme=premium] .side,[data-theme=premium] .topbar,[data-theme=premium] .statusbar,[data-theme=premium] .viewbar{backdrop-filter:blur(14px);box-shadow:0 4px 24px #0006}
[data-theme=premium] .b.primary{background:linear-gradient(90deg,#6366f1,#a855f7)}
[data-theme=premium] .b{transition:.2s}[data-theme=premium] .lcard,[data-theme=premium] .layer{backdrop-filter:blur(6px)}
[data-theme=light] .side{box-shadow:0 0 0 1px var(--line)}[data-theme=light]{--accent:#7c6cf0;--accent2:#6d5bd0}[data-theme=light] .b{background:#fff}
[data-theme=compact]{--bg:#1d1e26;--side:#262833;--canvas:#13141a}
body.compact .viewbar{padding:.15rem .5rem}body.compact .b{padding:.22rem .45rem}body.compact .body{padding:.45rem}body.compact section{margin-bottom:.6rem}body.compact .ctl{margin:.2rem 0}body.compact button.tab small{display:none}body.compact .brand small{display:none}body.compact .statusbar{padding:.1rem .6rem}
*{box-sizing:border-box}
html{font-size:calc(14px*var(--ui))}
body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden}
.topbar{display:flex;align-items:center;gap:.8rem;padding:.5rem .8rem;background:var(--side);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:1.15rem;letter-spacing:.2px;white-space:nowrap}.brand b{background:linear-gradient(90deg,#8b5cf6,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}.brand small{color:var(--text2);font-weight:400}
.grp{display:flex;gap:.3rem;padding-left:.8rem;border-left:1px solid var(--line)}.sp{flex:1}
.b,button.tab,select,input[type=text],input[type=datetime-local],textarea{font:inherit;color:var(--text)}
.b{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:.38rem .65rem;cursor:pointer;transition:.12s;white-space:nowrap}
.b:hover:not(:disabled){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--field))}.b:disabled{opacity:.4;cursor:default}
.b.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;box-shadow:0 0 14px color-mix(in srgb,var(--accent) 45%,transparent)}.b.primary:hover:not(:disabled){background:var(--accent2)}
.b.danger:hover{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 20%,var(--field))}.b.big{width:100%;padding:.7rem;font-size:1.05rem;margin-top:.5rem}
select,input[type=text],input[type=datetime-local],textarea{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:.35rem .5rem;width:100%}
textarea{resize:vertical;margin:.3rem 0}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--accent)}
.main{flex:1;display:flex;min-height:0}
.side{background:var(--side);display:flex;min-height:0}.side.left{width:19.5rem;border-right:1px solid var(--line)}.side.right{width:19rem;border-left:1px solid var(--line);flex-direction:column}
body.compact .side.left{width:16rem}body.compact .side.right{width:15.5rem}body.compact .topbar{padding:.25rem .5rem}
.tabs{display:flex}.tabs.vertical{flex-direction:column;border-right:1px solid var(--line);background:color-mix(in srgb,var(--side) 80%,#000)}
button.tab{background:none;border:0;cursor:pointer;padding:.5rem .35rem;display:flex;flex-direction:column;align-items:center;gap:.1rem;color:var(--text2);border-left:3px solid transparent;font-size:.9rem}
.tabs:not(.vertical) button.tab{flex:1;flex-direction:row;justify-content:center;border-left:0;border-bottom:3px solid transparent;padding:.6rem}
button.tab small{font-size:.65rem}button.tab b{font-size:1.15rem;font-weight:400}button.tab:hover{color:var(--text)}
button.tab.on{color:var(--accent2);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.body{flex:1;overflow:auto;padding:.7rem}
section{margin-bottom:1rem;padding-bottom:.4rem;border-bottom:1px solid var(--line)}section:last-child{border:0}
h3{margin:.1rem 0 .55rem;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text2)}h2{margin-top:0}
.ctl{display:grid;grid-template-columns:6.2rem 1fr 2.6rem;align-items:center;gap:.4rem;margin:.35rem 0;font-size:.88rem}.ctl>span{color:var(--text2)}
.ctl output{text-align:right;font-size:.78rem;color:var(--text2)}.ctl:not(:has(input[type=range])){grid-template-columns:6.2rem 1fr}
.ctl.row{display:flex;justify-content:space-between}.ctl.chk{gap:.4rem;justify-content:flex-start}
input[type=range]{width:100%;accent-color:var(--accent)}input[type=color]{width:2.6rem;height:1.7rem;border:1px solid var(--line);border-radius:6px;background:none;padding:0}input[type=checkbox]{accent-color:var(--accent)}
.brow{display:flex;gap:.35rem;margin:.35rem 0;flex-wrap:wrap}.brow>.b{flex:1}.brow>input,.brow>.ctl{flex:2}.seg .b{padding:.3rem}
.hint,.empty,small{color:var(--text2);font-size:.78rem;line-height:1.35}.hint{margin:.3rem 0}.hint.warn{color:#fbbf24}.empty{text-align:center;padding:1rem}
.dims{margin:0 0 .4rem;color:var(--accent2);font-weight:600}.folder{font-size:.82rem;word-break:break-all;margin:.2rem 0}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}.thumb{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--field);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover;cursor:pointer;display:block}.thumb small{position:absolute;left:0;right:0;bottom:0;background:#000a;color:#fff;font-size:.6rem;padding:1px 3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.thumb .tb{position:absolute;top:2px;right:2px;display:none;gap:1px}.thumb:hover .tb{display:flex}.tb button{background:#000b;color:#fff;border:0;border-radius:4px;font-size:.62rem;padding:2px 4px;cursor:pointer}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}.lcard{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:.4rem;cursor:pointer;color:var(--text);display:flex;flex-direction:column;align-items:center;gap:.15rem}
.lcard.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 12px color-mix(in srgb,var(--accent) 40%,transparent)}.lcard b{font-size:.85rem}.lcard small{font-size:.62rem;text-align:center}
.mini{display:grid;gap:2px;width:2.1rem;height:3.4rem}.mini i{background:var(--accent2);border-radius:2px;opacity:.85}
.swatches{display:flex;gap:.3rem;margin:.5rem 0}.sw{width:2rem;height:2rem;border-radius:50%;border:2px solid var(--line);cursor:pointer}.sw.on{border-color:var(--text);transform:scale(1.12)}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:.2rem;margin-bottom:.4rem}.emojis button{background:var(--field);border:1px solid var(--line);border-radius:6px;font-size:1.15rem;padding:.2rem 0;cursor:pointer}.emojis button:hover{border-color:var(--accent)}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:.35rem}.tplrow .b:first-child{flex:5}
.layers{display:flex;flex-direction:column;gap:.25rem}.layer{display:flex;align-items:center;gap:.15rem;padding:.25rem .35rem;background:var(--field);border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:.82rem}
.layer.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--field))}.layer.off{opacity:.5}.layer .ln{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.li{width:1.4rem;text-align:center;color:var(--accent2)}
.layer button{background:none;border:0;cursor:pointer;color:var(--text);font-size:.8rem;padding:.1rem .15rem;border-radius:4px}.layer button:hover{background:var(--line)}
#stage{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--canvas);min-width:0}
#stage.grid{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;background-color:var(--canvas)}
#stage.drop{outline:3px dashed var(--accent);outline-offset:-8px}
.canvaswrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;width:100%;min-height:0}
#preview{box-shadow:0 10px 50px #000a;background:repeating-conic-gradient(#808080 0 25%,#b0b0b0 0 50%) 0 0/20px 20px;touch-action:none;margin:auto}
.viewbar{display:flex;align-items:center;gap:.5rem;padding:.35rem .7rem;margin-bottom:.5rem;background:var(--side);border:1px solid var(--line);border-radius:10px;font-size:.85rem}.viewbar label{display:flex;gap:.25rem;align-items:center;color:var(--text2)}.viewbar .b{padding:.15rem .55rem}
.statusbar{display:flex;gap:1.2rem;padding:.25rem .8rem;background:var(--side);border-top:1px solid var(--line);font-size:.75rem;color:var(--text2)}.statusbar .grow{flex:1;color:var(--accent2);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#toasts{position:fixed;right:1rem;bottom:2.4rem;display:flex;flex-direction:column;gap:.45rem;z-index:50;max-width:26rem}
.toast{display:flex;gap:.55rem;align-items:center;background:var(--side);color:var(--text);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:.55rem .75rem;box-shadow:0 8px 30px #0009;font-size:.86rem;animation:in .2s;transition:.3s}
.toast.out{opacity:0;transform:translateX(30px)}.toast.success{border-left-color:#22c55e}.toast.error{border-left-color:var(--danger)}.toast.warn{border-left-color:#f59e0b}.toast .tm{flex:1;word-break:break-word}.toast button{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:.25rem .55rem;cursor:pointer}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
#batchProg{position:fixed;left:50%;transform:translateX(-50%);bottom:3rem;width:22rem;background:var(--side);border:1px solid var(--line);border-radius:10px;padding:.6rem;z-index:60;font-size:.8rem;text-align:center}
#batchProg[hidden]{display:none}#batchProg i{display:block;height:8px;width:0;background:linear-gradient(90deg,#8b5cf6,#38bdf8);border-radius:4px;margin-bottom:.4rem;transition:.2s}
dialog{background:var(--side);color:var(--text);border:1px solid var(--line);border-radius:14px;width:min(30rem,92vw);max-height:88vh;padding:1.2rem}dialog::backdrop{background:#000a}
.keys{width:100%;font-size:.85rem;border-collapse:collapse}.keys td{padding:.2rem .3rem;border-bottom:1px solid var(--line)}kbd{background:var(--field);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:.78rem}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
@media (max-width:1000px){.side.left{width:15rem}.side.right{width:15rem}}

</style>

<body>
<!-- Dark Creative Studio: top bar · left tool sidebar · central canvas · contextual right panel -->
<header class="topbar">
  <div class="brand">Charlie<b>MJ</b> PhotoStory <small id="ver">v2.0</small></div>
  <div class="grp">
    <button id="btnNew" class="b" title="New Story">New</button>
    <button id="btnOpen" class="b" title="Open project (Ctrl+O)">Open</button>
    <button id="btnSave" class="b" title="Save project (Ctrl+S)">Save</button>
  </div>
  <div class="grp">
    <button id="undoBtn" class="b" title="Undo (Ctrl+Z)">↶ Undo</button>
    <button id="redoBtn" class="b" title="Redo (Ctrl+Y)">↷ Redo</button>
    <button id="btnResetPhoto" class="b" title="Reset selected photo">Reset photo</button>
    <button id="btnResetLayout" class="b" title="Reset layout, spacing and photo positions">Reset layout</button>
  </div>
  <div class="grp"><select id="designSel" title="Design type"></select></div>
  <div class="sp"></div>
  <button id="btnTheme" class="b" title="Cycle interface design (Dark · Minimal · Premium · Compact)">◐</button>
  <button id="btnSettings" class="b" title="Settings & shortcuts">⚙</button>
  <button id="btnExport" class="b primary" title="Export (Ctrl+E)">⬇ Export</button>
</header>

<div class="main">
  <aside class="side left"><nav id="leftTabs" class="tabs vertical"></nav><div id="leftBody" class="body"></div></aside>
  <main id="stage" class="grid">
    <div class="canvaswrap"><canvas id="preview"></canvas></div>
    <div class="viewbar">
      <button id="zoomOut" class="b" title="Zoom out">−</button><span id="zoomPct">100%</span><button id="zoomIn" class="b" title="Zoom in">＋</button>
      <button id="zoomFit" class="b">Fit</button>
      <label><input type="checkbox" id="safeChk"> Safe-area overlay</label>
      <label><input type="checkbox" id="gridChk"> Grid</label>
    </div>
  </main>
  <aside class="side right"><nav id="rightTabs" class="tabs"></nav><div id="rightBody" class="body"></div></aside>
</div>

<footer class="statusbar"><span id="stLayout"></span><span id="stCanvas"></span><span id="stSel"></span><span id="stStatus" class="grow">Ready</span><span>🔒 100% offline</span></footer>

<div id="toasts"></div>
<div id="batchProg" hidden><i></i><span></span></div>
<dialog id="dlg"></dialog>
<input type="file" id="fileInput" accept="image/*" multiple hidden>
<input type="file" id="projectInput" accept=".json,.cmjstory" hidden>
<input type="file" id="bgInput" accept="image/*" hidden>
<input type="file" id="logoInput" accept="image/*" hidden>

<!-- Modules (classic scripts so the app also runs from file://) -->
<script>
/* ============================================================================
   core.js — namespace, event bus, state model, asset library, undo/redo
   Everything hangs off one global `PS` so the app works from file:// (no ES
   modules => no CORS problems) and inside the Tauri window alike.
   ========================================================================== */
window.PS = window.PS || {};
(function (PS) {
  /* ---------- tiny utilities ---------- */
  const bus = {};
  PS.on = (e, f) => (bus[e] = bus[e] || []).push(f);
  PS.emit = (e, d) => (bus[e] || []).forEach(f => { try { f(d); } catch (err) { console.error(e, err); } });
  PS.uid = () => Math.random().toString(36).slice(2, 9);
  PS.clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  PS.clone = o => JSON.parse(JSON.stringify(o));
  PS.isTauri = () => !!(window.__TAURI__ && window.__TAURI__.core);
  PS.invoke = (cmd, args) => window.__TAURI__.core.invoke(cmd, args);

  /* ---------- designs (canvas presets) ---------- */
  PS.DESIGNS = {
    story:  { name: 'Instagram Story (9:16)', w: 1080, h: 1920, safe: { top: 250, bottom: 250 } },
    reel:   { name: 'Instagram Reel (9:16)',  w: 1080, h: 1920, safe: { top: 220, bottom: 420 } },
    post:   { name: 'Instagram Post (4:5)',   w: 1080, h: 1350, safe: { top: 0, bottom: 0 } },
    square: { name: 'Instagram Square (1:1)', w: 1080, h: 1080, safe: { top: 0, bottom: 0 } }
  };

  /* ---------- asset library: every image lives here, state only holds ids ---------- */
  PS.assets = {};   // id -> {id,name,date,blob,url,img,w,h,focus:{x,y},kind:'photo'|'asset'}
  PS.photoOrder = []; // ids of library photos in current order

  /* ---------- layer factories ---------- */
  const adj = () => ({ brightness: 100, contrast: 100, saturation: 100, warmth: 0, sharpness: 0, grayscale: 0, blur: 0 });
  PS.newCell = slot => ({ id: PS.uid(), type: 'cell', name: 'Photo ' + (slot + 1), slot, assetId: null,
    zoom: 1, offX: 0, offY: 0, rot: 0, flipH: false, flipV: false, fit: 'fill', locked: false, hidden: false, adj: adj() });
  PS.textBase = () => ({ font: 'Arial', size: 72, color: '#ffffff', bold: true, italic: false, align: 'center',
    outlineW: 0, outlineColor: '#000000', shadowBlur: 0, shadowColor: '#000000', bgOn: false, bgColor: '#000000',
    bgAlpha: 0.5, pad: 16, opacity: 1 });
  PS.newText = (o) => Object.assign({ id: PS.uid(), type: 'text', name: 'Text', text: 'Your text', x: 540, y: 960, rot: 0,
    locked: false, hidden: false }, PS.textBase(), o || {});
  PS.newStamp = (o) => Object.assign(PS.newText({ type: 'stamp', name: 'Timestamp', size: 44, bold: false,
    shadowBlur: 8 }), { fmt: 'dddd, D MMMM YYYY • h:mm A', live: true, fixedTime: new Date().toISOString().slice(0, 16),
    caption: '', location: '' }, o || {});
  PS.newEmoji = (char, o) => Object.assign({ id: PS.uid(), type: 'emoji', name: 'Emoji ' + char, char, x: 540, y: 960,
    size: 160, rot: 0, opacity: 1, locked: false, hidden: false }, o || {});
  PS.newImageLayer = (assetId, name) => ({ id: PS.uid(), type: 'image', name: name || 'Logo', assetId, x: 900, y: 1700,
    size: 220, rot: 0, opacity: 0.9, locked: false, hidden: false });

  /* ---------- state ---------- */
  PS.newState = function () {
    const s = {
      design: 'story', layout: '2x2', rows: 2, cols: 2, rowW: [], colW: [],
      gap: 12, margin: 0, radius: 0, borderW: 0, borderColor: '#ffffff', cellFill: '#00000000',
      bg: { type: 'solid', color: '#15161d', c1: '#8b5cf6', c2: '#1e1b4b', angle: 160, blur: 40, assetId: null },
      layers: []
    };
    PS.syncCells(s);
    return s;
  };
  /* make sure the state has exactly rows*cols cell layers (extras removed, new appended at bottom) */
  PS.syncCells = function (s) {
    const need = s.rows * s.cols;
    const cells = s.layers.filter(l => l.type === 'cell').sort((a, b) => a.slot - b.slot);
    cells.slice(need).forEach(c => s.layers.splice(s.layers.indexOf(c), 1));
    for (let i = cells.length; i < need; i++) {
      const at = s.layers.filter(l => l.type === 'cell').length;
      s.layers.splice(at, 0, PS.newCell(i));
    }
    s.rowW = Array.from({ length: s.rows }, (_, i) => s.rowW[i] || 1);
    s.colW = Array.from({ length: s.cols }, (_, i) => s.colW[i] || 1);
  };
  PS.state = PS.newState();
  PS.selectedId = null;
  PS.getLayer = (id, s) => (s || PS.state).layers.find(l => l.id === id);
  PS.selected = () => PS.getLayer(PS.selectedId);
  PS.cells = s => (s || PS.state).layers.filter(l => l.type === 'cell').sort((a, b) => a.slot - b.slot);

  /* ---------- undo / redo (snapshots of state JSON; images are not duplicated) ---------- */
  let hist = [], hi = -1;
  PS.commit = function (label) {
    hist = hist.slice(0, hi + 1);
    hist.push(JSON.stringify(PS.state));
    if (hist.length > 100) hist.shift();
    hi = hist.length - 1;
    PS.emit('committed', label);
    PS.touch();
  };
  PS.resetHistory = () => { hist = []; hi = -1; PS.commit(); };
  PS.canUndo = () => hi > 0; PS.canRedo = () => hi < hist.length - 1;
  function restore(i) {
    PS.state = JSON.parse(hist[i]); hi = i;
    if (!PS.getLayer(PS.selectedId)) PS.selectedId = null;
    PS.emit('panels'); PS.touch(); PS.emit('committed');
  }
  PS.undo = () => { if (PS.canUndo()) { restore(hi - 1); PS.notify('Undo', 'info'); } };
  PS.redo = () => { if (PS.canRedo()) { restore(hi + 1); PS.notify('Redo', 'info'); } };

  /* touch = "something changed, repaint" (cheap; no history entry) */
  PS.touch = () => PS.emit('repaint');

  PS.select = id => { PS.selectedId = id; PS.emit('select'); PS.touch(); };

  /* ---------- image loading ---------- */
  PS.loadImage = (blob) => new Promise((res, rej) => {
    const url = URL.createObjectURL(blob), img = new Image();
    img.onload = () => res({ url, img }); img.onerror = () => rej(new Error('Could not decode image'));
    img.src = url;
  });

/* settings.js — preferences. Portable: in the desktop app they live in settings.json
   next to the .exe; in a browser they fall back to localStorage. Also a tiny IndexedDB helper. */
(function (PS) {
  const DEFAULTS = { theme: 'dark', uiScale: 1, compact: false, exportDir: '', format: 'jpg', quality: 92, resolution: 1,
    baseName: 'CharlieMJ-Story', jpgBg: '#ffffff', safeArea: false, showGrid: true, sortMode: 'manual' };
  PS.THEMES = { dark: 'Dark Creative Studio', light: 'Clean Minimal Studio', premium: 'Premium Gradient Studio', compact: 'Compact Portable Workspace' };
  PS.settings = Object.assign({}, DEFAULTS);
  PS.loadSettings = async function () {
    let raw = null;
    try { raw = PS.isTauri() ? await PS.invoke('read_settings') : localStorage.getItem('cmj-settings'); } catch (e) {}
    try { if (raw) Object.assign(PS.settings, JSON.parse(raw)); } catch (e) {}
    PS.applySettings();
  };
  PS.saveSettings = function () {
    const j = JSON.stringify(PS.settings);
    try { localStorage.setItem('cmj-settings', j); } catch (e) {}
    if (PS.isTauri()) PS.invoke('write_settings', { json: j }).catch(() => {});
  };
  PS.applySettings = function () {
    const s = PS.settings, r = document.documentElement;
    if (s.theme === 'light') s.theme = 'minimal';
    r.dataset.theme = s.theme; r.style.setProperty('--ui', s.uiScale); document.body.classList.toggle('compact', !!s.compact || s.theme === 'compact');
    PS.emit('settings');
  };

  /* IndexedDB key/value (used for crash recovery) */
  let dbp;
  const db = () => dbp || (dbp = new Promise((res, rej) => { const q = indexedDB.open('cmj-photostory', 1);
    q.onupgradeneeded = () => q.result.createObjectStore('kv'); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }));
  PS.idb = {
    async get(k) { const d = await db(); return new Promise((res, rej) => { const r = d.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
    async set(k, v) { const d = await db(); return new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
    async del(k) { const d = await db(); return new Promise(res => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; }); }
  };

  /* ---- crash recovery: debounce-save state + image blobs ---- */
  let timer;
  PS.scheduleRecovery = function () {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      try { const assets = Object.values(PS.assets).map(a => ({ id: a.id, name: a.name, date: a.date, kind: a.kind, blob: a.blob }));
        await PS.idb.set('recovery', { state: PS.state, assets, order: PS.photoOrder, at: Date.now() }); } catch (e) { /* quota etc: ignore silently */ }
    }, 1500);
  };
  PS.checkRecovery = async function () {
    let rec; try { rec = await PS.idb.get('recovery'); } catch (e) { return; }
    if (!rec || !rec.state || !rec.state.layers.some(l => l.type !== 'cell' || l.assetId)) return;
    PS.notify('Unfinished work found from ' + new Date(rec.at).toLocaleString(), 'warn', { sticky: true, actions: [
      { label: 'Restore', fn: async () => { try { await PS.restoreRecord(rec.state, rec.assets, rec.order); PS.notify('Recovered your unfinished Story', 'success'); } catch (e) { PS.notify('Recovery failed: ' + e.message, 'error'); } } },
      { label: 'Discard', fn: () => PS.idb.del('recovery') }] });
  };
  /* shared by recovery + project open */
  PS.restoreRecord = async function (state, assets, order) {
    Object.values(PS.assets).forEach(a => URL.revokeObjectURL(a.url)); PS.assets = {}; PS.photoOrder = [];
    for (const a of assets) await PS.addAsset(a.blob, a.name, a.date, a.kind, a.id);
    if (order) PS.photoOrder = order.filter(id => PS.assets[id]);
    PS.state = state; PS.syncCells(PS.state); PS.selectedId = null; PS.resetHistory(); PS.emit('panels');
  };
})(window.PS);

</script>
